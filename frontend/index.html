<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="title-row">
      <h1>Job Application Tracker</h1>
      <div id="account" class="account" hidden>
        <span id="who" class="muted"></span>
        <button type="button" id="logout-btn" class="secondary small">Log out</button>
      </div>
    </div>
    <p id="summary" class="muted"></p>
  </header>

  <section id="auth" class="auth" hidden>
    <form id="auth-form">
      <h2 id="auth-title">Log in</h2>
      <label>Email <input name="email" type="email" required autocomplete="username"></label>
      <label id="password-field">Password
        <input name="password" type="password" minlength="8" autocomplete="current-password">
      </label>
      <label id="code-field" hidden>Code from your email
        <input name="code" inputmode="numeric" autocomplete="one-time-code">
      </label>
      <button type="submit" id="auth-submit">Log in</button>
      <button type="button" id="auth-toggle" class="link">Need an account? Sign up</button>
      <button type="button" id="resend-btn" class="link" hidden>Resend code</button>
      <p id="auth-msg" class="muted"></p>
      <p id="auth-error" class="error" role="alert"></p>
    </form>
  </section>

  <main id="tracker" hidden>
    <form id="app-form">
      <input type="hidden" name="id">
      <div id="autofill" class="autofill wide" hidden>
        <label>Paste a job ad or a link to it to fill this in
          <textarea id="ad-text" rows="3" maxlength="20000" placeholder="Paste the job description, or a link to the job"></textarea>
        </label>
        <div class="actions">
          <button type="button" id="autofill-btn" class="secondary">Auto-fill</button>
          <span id="autofill-msg" class="muted"></span>
        </div>
      </div>
      <label>Company <input name="company" required maxlength="100"></label>
      <label>Role <input name="role" required maxlength="100"></label>
      <label>Status
        <select name="status">
          <option value="applied">Applied</option>
          <option value="interviewing">Interviewing</option>
          <option value="offer">Offer</option>
          <option value="rejected">Rejected</option>
          <option value="withdrawn">Withdrawn</option>
        </select>
      </label>
      <label>Applied on <input name="applied_on" type="date" required></label>
      <label>Closes on <input name="closes_on" type="date"></label>
      <label>Salary <input name="salary" maxlength="200"></label>
      <label>Location <input name="location" maxlength="100"></label>
      <label>Work mode
        <select name="work_mode">
          <option value="">-</option>
          <option value="remote">Remote</option>
          <option value="hybrid">Hybrid</option>
          <option value="onsite">On-site</option>
        </select>
      </label>
      <label>Job type <input name="job_type" maxlength="100" placeholder="e.g. Graduate scheme"></label>
      <label class="wide">Experience needed <input name="experience" maxlength="300"></label>
      <label class="wide">Skills <input name="skills" placeholder="comma separated, e.g. AWS, Terraform"></label>
      <label class="wide">Job URL <input name="url" type="url" placeholder="https://"></label>
      <label class="wide">Notes <textarea name="notes" rows="2" maxlength="2000"></textarea></label>
      <div class="actions wide">
        <button type="submit" id="submit-btn">Add application</button>
        <button type="button" id="cancel-btn" class="secondary" hidden>Cancel edit</button>
      </div>
      <p id="error" class="error" role="alert"></p>
    </form>

    <table>
      <thead>
        <tr><th>Company</th><th>Role</th><th>Status</th><th>Applied</th><th>Closes</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="muted" hidden>No applications yet. Add your first one above.</p>
  </main>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
